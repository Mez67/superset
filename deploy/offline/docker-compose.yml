#
# Offline deployment: every service runs from an image loaded with
# `docker load` (see README.fa.md); nothing is built or pulled.
# Settings live in .env (secrets, ports) and config/superset_config_docker.py.

x-superset: &superset
  image: ${SUPERSET_IMAGE:?set SUPERSET_IMAGE in .env}
  pull_policy: never
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./config:/app/docker/pythonpath_dev:ro
    - superset_home:/app/superset_home

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7}
    pull_policy: never
    restart: unless-stopped
    volumes:
      - redis:/data

  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    pull_policy: never
    env_file: .env
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data

  superset-init:
    <<: *superset
    command: ["/app/docker/docker-init.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      disable: true

  superset:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully

  superset-worker:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  superset_home:
  db_home:
  redis:
